<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Koubo Studio</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">K</div>
        <div>
          <h1>口播视频智能体</h1>
          <p id="service-state">检测服务中</p>
        </div>
      </div>
      <div class="status-pills">
        <span id="asr-pill">ASR</span>
        <span id="tts-pill">TTS</span>
        <span id="video-pill">Video</span>
      </div>
    </header>

    <main class="workspace">
      <section class="panel script-panel">
        <div class="panel-title">
          <span></span>
          <h2>文案仿写</h2>
          <span></span>
        </div>
        <form id="job-form" class="form-grid">
          <label>
            <span>对标链接</span>
            <input name="competitor_url" placeholder="https://v.douyin.com/..." />
          </label>

          <label>
            <span>对标视频</span>
            <input name="competitor_file" type="file" accept="video/*" />
          </label>

          <label class="wide">
            <span>已有文案</span>
            <textarea name="source_text" rows="7" placeholder="粘贴文案后可跳过视频解析"></textarea>
          </label>

          <label class="wide">
            <span>商品卖点</span>
            <textarea name="product_brief" rows="5" placeholder="品类、价格带、人群、场景、核心卖点"></textarea>
          </label>

          <div class="inline-controls">
            <label>
              <span>口播风格</span>
              <select name="tone">
                <option>电商口播</option>
                <option>情绪种草</option>
                <option>测评拆解</option>
                <option>老板直讲</option>
              </select>
            </label>
            <label>
              <span>音色名</span>
              <input name="voice_name" value="default" />
            </label>
          </div>

          <div class="provider-grid">
            <label>
              <span>文案提取</span>
              <select name="asr_provider">
                <option value="auto">自动</option>
                <option value="local">本地模型</option>
                <option value="api">API</option>
              </select>
            </label>
            <label>
              <span>AI 改写</span>
              <select name="llm_provider">
                <option value="auto">自动</option>
                <option value="local">本地模型</option>
                <option value="api">API</option>
              </select>
            </label>
            <label>
              <span>语音生成</span>
              <select name="tts_provider">
                <option value="auto">自动</option>
                <option value="local">本地模型</option>
                <option value="api">API</option>
              </select>
            </label>
            <label>
              <span>口型同步</span>
              <select name="lipsync_provider">
                <option value="auto">自动</option>
                <option value="local">本地模型</option>
                <option value="api">API</option>
              </select>
            </label>
          </div>

          <div class="platforms" aria-label="发布平台">
            <label><input type="checkbox" value="douyin" />抖音</label>
            <label><input type="checkbox" value="shipinhao" />视频号</label>
            <label><input type="checkbox" value="xiaohongshu" />小红书</label>
            <label><input type="checkbox" value="kuaishou" />快手</label>
          </div>
        </form>
      </section>

      <section class="panel media-panel">
        <div class="panel-title">
          <span></span>
          <h2>音频视频</h2>
          <span></span>
        </div>
        <div class="upload-grid">
          <label class="upload-tile">
            <span>真人静默视频</span>
            <input id="avatar_video" form="job-form" name="avatar_video" type="file" accept="video/*" required />
          </label>
          <label class="upload-tile">
            <span>声音样本</span>
            <input form="job-form" name="voice_sample" type="file" accept="audio/*" />
          </label>
          <label class="upload-tile">
            <span>背景音乐</span>
            <input form="job-form" name="bgm_file" type="file" accept="audio/*" />
          </label>
        </div>

        <button id="create-job" form="job-form" type="submit">生成口播视频</button>

        <div class="steps" id="steps"></div>
      </section>

      <section class="panel preview-panel">
        <div class="panel-title">
          <span></span>
          <h2>视频剪辑</h2>
          <span></span>
        </div>
        <div class="preview-shell">
          <video id="preview-video" controls playsinline></video>
          <div id="empty-preview" class="empty-preview">等待成片</div>
        </div>
        <div class="artifact-actions">
          <a id="audio-link" href="#" hidden>下载音频</a>
          <a id="script-link" href="#" hidden>下载文案</a>
          <a id="subtitle-link" href="#" hidden>下载字幕</a>
          <a id="cover-link" href="#" hidden>下载封面</a>
          <a id="video-link" href="#" hidden>下载成片</a>
        </div>
      </section>

      <section class="panel output-panel">
        <div class="panel-title">
          <span></span>
          <h2>标题话题</h2>
          <span></span>
        </div>
        <input id="title-output" readonly placeholder="生成后显示标题" />
        <div id="topics-output" class="topic-row"></div>
        <textarea id="script-output" readonly rows="12" placeholder="生成后显示改写文案"></textarea>
      </section>

      <section class="panel publish-panel">
        <div class="panel-title">
          <span></span>
          <h2>发布平台</h2>
          <span></span>
        </div>
        <div class="platform-icons">
          <div>抖音</div>
          <div>视频号</div>
          <div>小红书</div>
          <div>快手</div>
        </div>
        <pre id="publish-report"></pre>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
